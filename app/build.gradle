plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lfy.autoimageclicker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lfy.autoimageclicker'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-wechat-fast'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
