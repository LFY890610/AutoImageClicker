name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autoimageclicker-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoImageClicker.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoImageClicker-APK
          path: AutoImageClicker.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AutoImageClicker.apk --target "$GITHUB_SHA" --title "AutoImageClicker 严格防误识别版" --notes "第一阶段升级为严格版式识别：宽橙色红包卡片+左侧红色红包图标+黄色金币+右上白色祝福语区域+下方微信红包白字区域必须同时满足，并要求连续两帧同位置确认后才点击1次，用于排除表情误识别。第二阶段保持中央開/开按钮快速点击2次。"
