name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autoimageclicker-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoImageClicker.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoImageClicker-APK
          path: AutoImageClicker.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AutoImageClicker.apk --target "$GITHUB_SHA" --title "AutoImageClicker 无障碍诊断修正版" --notes "继续保持无视觉、无录屏。修复微信分身身份识别：明确红包通知会自动学习对应分身包名，也可在进入分身后返回软件，一键把最近应用设为可信微信分身。红包节点识别从仅匹配‘微信红包’扩展到微信内包含‘红包/领取红包’的结构化节点，同时保留本软件界面硬隔离和每次动作前微信身份校验。新增可见诊断：记录最近包名/类名、微信身份判断、根节点是否可读、红包节点数、精确微信红包节点数、开/開节点数和最后动作，用于确认当前微信版本是否把红包暴露给 Android 无障碍。"
