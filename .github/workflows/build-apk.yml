name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autoimageclicker-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoImageClicker.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoImageClicker-APK
          path: AutoImageClicker.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AutoImageClicker.apk --target "$GITHUB_SHA" --title "AutoImageClicker 新红包时间监控版" --notes "改为以用户点击‘从现在开始监控新红包’为时间起点。进入聊天、切换群聊或滚动历史消息时，当前已经存在的红包只建立历史基线，不执行点击；只有监控开始以后通过微信无障碍内容变化新出现的红包才进入领取流程。监控期间收到明确红包通知时，会仅授权对应新红包处理。红包仍只点击1次，开/開只点击1次并自动返回。继续保持无视觉、无录屏，并把空闲保底检查降为500ms以进一步降低耗电。"
