name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autoimageclicker-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoImageClicker.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoImageClicker-APK
          path: AutoImageClicker.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AutoImageClicker.apk --target "$GITHUB_SHA" --title "AutoImageClicker ColorOS多窗口新红包监控版" --notes "针对实机诊断中 com.coloros.assistantscreen 抢占活动无障碍窗口导致微信点击全部被安全校验拦截的问题，重写核心无障碍服务。新核心启用多窗口枚举，在 ColorOS 侧边栏/悬浮助手覆盖时仍从全部交互窗口中定位真实 com.tencent.mm/可信分身窗口。监控逻辑只处理用户点击开始之后的新红包：进入聊天、切群、滚动时只建立历史基线；新红包通过内容变化 + 可见红包快照变化确认后才点击。明确红包通知可作为新红包信号。继续保持无视觉、无录屏，红包1次、开/開1次、完成后自动返回。"
