name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: autoimageclicker-latest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoImageClicker.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoImageClicker-APK
          path: AutoImageClicker.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest AutoImageClicker.apk --target "$GITHUB_SHA" --title "AutoImageClicker 纯无障碍事件极速版" --notes "保持完全无视觉、无录屏、低功耗架构。新增事件直达极速处理：优先直接处理本次发生变化的无障碍节点，发现‘微信红包’立即点击1次；红包弹窗事件出现‘開/开’或中央可点击控件时立即点击1次，不再等待固定25/55毫秒。仅在事件信息不足时执行少量整窗口兜底查询。无障碍配置不再硬限制单一微信包名，并兼容主微信、系统级微信分身以及保留微信类名的常见分身场景。领取完成后自动返回，并继续抑制同一红包重复处理。"
